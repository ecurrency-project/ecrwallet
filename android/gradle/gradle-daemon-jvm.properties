#Gradle Daemon JVM criteria.
#Pinned to Java 17 (the version React Native 0.86 targets).
#Do not raise to 24+: the JDK then prints JEP 472 "restricted method" warnings to
#stderr, and AGP's prefab error parser (GeneratePrefabPackages.reportErrors) treats
#every stderr line as a build error, breaking C/C++ configuration of native modules
#such as react-native-screens. This keeps IDE sync and CLI builds on the same JVM.
toolchainVersion=17
